[workspace]
resolver = "2"
members = [
    "crates/protocol-encoding",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
taceo-poseidon2 = { version = "=0.3.0", default-features = false, features = ["bn254", "t2", "t3", "t4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
